<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sync Audio Player</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <span class="logo">🎵</span>
      <span class="title">Sync Audio Player</span>
      <span id="syncDot" class="dot" title="Sync status"></span>
    </header>

    <div id="lockedBanner" class="banner hidden">Controls are locked by the GM</div>
    <div id="statusMsg" class="banner status hidden"></div>

    <form id="addForm" class="load-row">
      <input id="urlInput" type="text" placeholder="Paste a YouTube link…" autocomplete="off" />
      <button id="addBtn" type="submit">Add</button>
    </form>

    <div class="channels-header">
      <span>Sounds</span>
      <span id="channelsCount" class="playlist-count">0</span>
      <button id="clearAllBtn" class="text-btn" title="Remove all sounds">Clear all</button>
    </div>
    <div id="channels" class="channels"></div>

    <div class="footer-row">
      <label id="gmLockRow" class="lock-row hidden">
        <input id="lockCheckbox" type="checkbox" />
        Only GM can control playback
      </label>
    </div>
  </div>

  <div id="playerHost" style="position:absolute; width:0; height:0; overflow:hidden;"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
